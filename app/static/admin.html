<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results | Fossil Ridge Science Bowl</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .admin-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:20px 0 26px; }
    .summary-box { background:#fff; border:1px solid var(--line); padding:14px 16px; border-radius:4px; }
    .summary-box span { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.7px; margin-bottom:7px; }
    .summary-box strong { font-size:24px; font-weight:650; }
    .admin-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:18px 0; }
    select { padding:9px 10px; border:1px solid #cbd4cd; border-radius:4px; background:#fff; color:var(--ink); }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); background:#fff; border-radius:4px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:11px 12px; border-bottom:1px solid #e9ede9; vertical-align:top; }
    th { color:var(--muted); background:#f7f8f5; font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
    tr:last-child td { border-bottom:0; }
    .link-button { border:0; background:none; padding:0; color:var(--green); cursor:pointer; font:inherit; text-decoration:underline; }
    .detail-panel { margin-top:20px; padding:20px; border:1px solid var(--line); background:#fff; border-radius:4px; }
    .detail-row { padding:14px 0; border-top:1px solid #e9ede9; }
    .detail-meta { display:flex; flex-wrap:wrap; gap:14px; color:var(--muted); font-size:12px; margin-top:7px; }
    .answer-text { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:7px; }
    .pill { display:inline-block; border-radius:3px; background:#edf1ed; color:#48564e; padding:3px 7px; font-size:11px; }
    .admin-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .button-row { display:flex; gap:8px; flex-wrap:wrap; }
    @media (max-width:850px) { .admin-summary {grid-template-columns:repeat(2,1fr);} }
  </style>
</head>
<body>
  <header class="site-header"><div class="header-inner"><a class="wordmark" href="/">Fossil Ridge Science Bowl</a><span class="header-note">Administrator results</span></div></header>
  <main class="page-shell">
    <div class="admin-head">
      <div><p class="eyebrow">Administrator</p><h1>Quiz results</h1><p class="muted">Responses are saved as students submit them. Nothing is automatically graded.</p></div>
      <div class="button-row"><a class="button" href="/api/admin/export.csv">Download all results (CSV)</a><button class="button" id="backup-now">Back up now</button><button class="button quiet" id="logout">Sign out</button></div>
    </div>
    <div id="summary" class="admin-summary"></div>
    <div class="admin-toolbar">
      <label for="quiz-filter">Quiz</label><select id="quiz-filter"><option value="">All quizzes</option></select>
      <label for="status-filter">Status</label><select id="status-filter"><option value="">All attempts</option><option value="completed">Completed</option><option value="in_progress">In progress</option></select>
      <button id="refresh" class="button">Refresh</button>
      <span id="admin-message" class="muted small" aria-live="polite"></span>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Student</th><th>Quiz</th><th>Status</th><th>Progress</th><th>Started</th><th>Details</th></tr></thead><tbody id="attempt-rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
    <section id="detail" class="detail-panel hidden"></section>
  </main>
  <footer class="site-footer"><span>Fossil Ridge Science Bowl</span><a href="/">Student page</a></footer>
  <script src="/static/admin.js" defer></script>
</body>
</html>
